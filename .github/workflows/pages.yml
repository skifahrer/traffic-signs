name: Publish viewer

# Builds the sign viewer (python -m viewer) from master and publishes it on
# GitHub Pages: when signs or the viewer change on master, after every run of
# the sync workflow (its commits are pushed by GitHub Actions, which does not
# start a push run), and on demand.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths:
      - "signs/**"
      - "viewer/**"
      - "pipelines/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    # Must match `name:` in sync.yml (tests/test_workflow.py checks this).
    workflows: ["Sync signs from Wikipedia"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # configure-pages only says "Not Found" when Pages is off, and the
      # workflow token cannot switch it on, so explain what to do instead.
      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! build_type=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null); then
            message="GitHub Pages is not enabled. Enable it once in Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
          elif [ "$build_type" != "workflow" ]; then
            message="GitHub Pages builds from a branch. Set Settings → Pages → Build and deployment → Source to GitHub Actions, then re-run this workflow."
          else
            echo "GitHub Pages is enabled and deploys from GitHub Actions."
            exit 0
          fi
          echo "::error title=GitHub Pages setup::$message"
          echo "### $message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the viewer
        run: python -m viewer --out _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
