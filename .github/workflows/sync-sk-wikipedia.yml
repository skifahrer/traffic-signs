name: Sync Slovak signs from Wikipedia

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      prune:
        description: Delete signs that are no longer on the Wikipedia page
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sk-wikipedia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Sync from sk.wikipedia.org
        id: sync
        env:
          WIKIMEDIA_USER_AGENT: >-
            traffic-signs-sync/1.0 (https://github.com/${{ github.repository }}; GitHub Actions) python-urllib
        run: |
          args=(--report "$RUNNER_TEMP/report.md")
          if [ "${{ inputs.prune }}" = "true" ]; then args+=(--prune); fi
          if python -m pipelines.sk_wikipedia "${args[@]}"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f "$RUNNER_TEMP/report.md" ]; then
            echo "The sync stopped before writing a report; see the job log." > "$RUNNER_TEMP/report.md"
          fi
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/sk-wikipedia
          delete-branch: true
          add-paths: signs/**
          commit-message: "Sync Slovak traffic signs from Wikipedia"
          title: "Sync Slovak traffic signs from Wikipedia"
          body-path: ${{ runner.temp }}/report.md
          labels: sync

      - name: Fail if the sync reported errors
        if: steps.sync.outputs.failed == 'true'
        run: |
          echo "::error::The sync reported errors, see the job summary."
          exit 1
