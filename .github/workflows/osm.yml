name: Sync OSM sign support

# Which `traffic_sign` values OpenStreetMap has (taginfo, the OSM wiki) and
# which image in signs/ draws each, into osm/<cc>.json. Runs after the weekly
# Wikipedia sync and commits straight to the branch it runs on.

on:
  schedule:
    - cron: "47 6 * * 1" # Mondays 06:47 UTC, after "Sync signs from Wikipedia"
  workflow_dispatch:
    inputs:
      countries:
        description: Countries, space-separated (empty = all)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-signs
  cancel-in-progress: false

jobs:
  osm:
    name: OSM support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Read OSM
        env:
          COUNTRIES: ${{ inputs.countries }}
        run: |
          # word splitting is the point: one argument per country
          # shellcheck disable=SC2086
          python -m pipelines.osm $COUNTRIES 2>&1 | tee "$RUNNER_TEMP/osm.log"
          {
            echo "### OSM sign support"
            echo '```'
            grep -E '^\[.*\] [a-z]{2}: ' "$RUNNER_TEMP/osm.log" | sed 's/^\[[^]]*\] //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the changes
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A osm
          if git diff --cached --quiet; then
            echo "No changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "Sync OSM sign support" -m "Run: $RUN_URL"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              exit 0
            fi
            sleep $((2 ** attempt))
            git pull --rebase origin "$BRANCH" || { git rebase --abort || true; exit 1; }
          done
          echo "::error::Could not push osm/ to $BRANCH."
          exit 1
