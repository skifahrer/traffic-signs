name: Sync signs from Wikipedia

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC, all countries
  workflow_dispatch:
    inputs:
      countries:
        description: "Countries to sync: all, or country codes separated by spaces (e.g. sk or sk cz)"
        type: string
        default: all
      prune:
        description: Delete signs that are no longer on the Wikipedia page
        type: boolean
        default: false
      verbose:
        description: Also log signs that are already up to date
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-${{ inputs.countries || 'all' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Choose countries
        id: countries
        env:
          REQUESTED: ${{ inputs.countries || 'all' }}
        run: |
          # Normalise "SK, cz" to "sk cz"; anything but letters and spaces is dropped.
          countries=$(echo "$REQUESTED" | tr 'A-Z,' 'a-z ' | tr -cd 'a-z ' | xargs)
          countries=${countries:-all}
          python -m pipelines --list
          echo "list=$countries" >> "$GITHUB_OUTPUT"
          echo "slug=${countries// /-}" >> "$GITHUB_OUTPUT"

      - name: Sync (${{ steps.countries.outputs.list }})
        id: sync
        env:
          COUNTRIES: ${{ steps.countries.outputs.list }}
          PRUNE: ${{ inputs.prune }}
          VERBOSE: ${{ inputs.verbose }}
          WIKIMEDIA_USER_AGENT: >-
            traffic-signs-sync/1.0 (https://github.com/${{ github.repository }}; GitHub Actions) python-urllib
        run: |
          args=($COUNTRIES --report "$RUNNER_TEMP/report.md")
          if [ "$PRUNE" = "true" ]; then args+=(--prune); fi
          if [ "$VERBOSE" = "true" ]; then args+=(--verbose); fi
          if python -m pipelines "${args[@]}"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f "$RUNNER_TEMP/report.md" ]; then
            echo "The sync stopped before writing a report; see the job log." > "$RUNNER_TEMP/report.md"
          fi
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/${{ steps.countries.outputs.slug }}
          delete-branch: true
          add-paths: signs/**
          commit-message: "Sync traffic signs from Wikipedia (${{ steps.countries.outputs.list }})"
          title: "Sync traffic signs from Wikipedia (${{ steps.countries.outputs.list }})"
          body-path: ${{ runner.temp }}/report.md
          labels: sync

      - name: Fail if the sync reported errors
        if: steps.sync.outputs.failed == 'true'
        run: |
          echo "::error::The sync reported errors, see the job summary."
          exit 1
