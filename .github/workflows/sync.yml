name: Sync signs from Wikipedia

# "Start" runs the tests and works out which countries to sync. Then every
# country gets its own "Sync <country>" job; they run one after another and
# each commits its changes straight to the branch the workflow runs on
# (master for the weekly run). Publish viewer runs after this workflow.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC, all countries
  workflow_dispatch:
    inputs:
      country:
        description: Country to sync
        type: choice
        # `all` plus one entry per folder in pipelines/countries; tests/test_workflow.py checks this.
        options:
          - all
          - at
          - au
          - be
          - ca
          - cz
          - de
          - dk
          - ee
          - fi
          - fr
          - gb
          - gr
          - hu
          - ie
          - lv
          - nl
          - pl
          - pt
          - ro
          - sk
          - ua
          - us
          - us-states
        default: all
      prune:
        description: Delete signs that left the Wikipedia page instead of archiving them
        type: boolean
        default: false
      verbose:
        description: Also log signs that are already up to date
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-signs
  cancel-in-progress: false

jobs:
  start:
    name: Start
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.plan.outputs.countries }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Choose countries
        id: plan
        env:
          COUNTRY: ${{ inputs.country || 'all' }}
        run: |
          python -m pipelines --list
          countries=$(python -m pipelines "$COUNTRY" --matrix)
          echo "Countries to sync: $countries"
          echo "countries=$countries" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ matrix.country }}
    needs: start
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # one country after another
      fail-fast: false # a failing country does not stop the next one
      matrix:
        country: ${{ fromJSON(needs.start.outputs.countries) }}
    steps:
      # The branch tip, not the commit the run started on: it already has the
      # previous country's commit, which may have touched the same names files.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync ${{ matrix.country }} from Wikipedia
        id: sync
        env:
          COUNTRY: ${{ matrix.country }}
          PRUNE: ${{ inputs.prune }}
          VERBOSE: ${{ inputs.verbose }}
          WIKIMEDIA_USER_AGENT: >-
            traffic-signs-sync/1.0 (https://github.com/${{ github.repository }}; GitHub Actions) python-urllib
        run: |
          args=("$COUNTRY" --report "$RUNNER_TEMP/report.md")
          if [ "$PRUNE" = "true" ]; then args+=(--prune); fi
          if [ "$VERBOSE" = "true" ]; then args+=(--verbose); fi
          if python -m pipelines "${args[@]}"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f "$RUNNER_TEMP/report.md" ]; then
            echo "The sync stopped before writing a report; see the job log." > "$RUNNER_TEMP/report.md"
          fi
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Signs written before an error are complete, so they are committed
      # too; the last step still fails the job.
      - name: Commit and push the changes
        env:
          COUNTRY: ${{ matrix.country }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A signs
          if git diff --cached --quiet; then
            echo "No changes for $COUNTRY."
            echo "No changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Sync traffic signs from Wikipedia ($COUNTRY)"
            echo
            # The report's counts: the bullet list before the first section.
            awk '/^### /{exit} /^- /' "$RUNNER_TEMP/report.md"
            echo
            echo "Report: $RUN_URL"
          } > "$RUNNER_TEMP/message.txt"
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git show --stat --format="Committed %h: %s" HEAD | tail -1
          # Someone may have pushed meanwhile: rebase onto it and try again.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              sha=$(git rev-parse --short HEAD)
              echo "Pushed $sha to $BRANCH."
              echo "Committed [\`$sha\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha) to \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((2 ** attempt))
            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
              echo "::error::The $COUNTRY changes conflict with new commits on $BRANCH; re-run the sync."
              exit 1
            fi
          done
          echo "::error::Could not push the $COUNTRY changes to $BRANCH. If the branch is protected, allow GitHub Actions to push to it."
          exit 1

      - name: Fail if the sync reported errors
        if: steps.sync.outputs.failed == 'true'
        env:
          COUNTRY: ${{ matrix.country }}
        run: |
          echo "::error::The $COUNTRY sync reported errors, see the job summary."
          exit 1
