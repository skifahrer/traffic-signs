name: Sync signs from Wikipedia

# "Start" runs the tests and works out which countries to sync. Then every
# country gets its own "Sync <country>" job; they run one after another and
# each opens its own pull request on sync/<country>.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC, all countries
  workflow_dispatch:
    inputs:
      country:
        description: Country to sync
        type: choice
        # `all` plus one entry per folder in pipelines/countries; tests/test_workflow.py checks this.
        options:
          - all
          - cz
          - pl
          - sk
        default: all
      prune:
        description: Delete signs that left the Wikipedia page instead of archiving them
        type: boolean
        default: false
      verbose:
        description: Also log signs that are already up to date
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-signs
  cancel-in-progress: false

jobs:
  start:
    name: Start
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.plan.outputs.countries }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Choose countries
        id: plan
        env:
          COUNTRY: ${{ inputs.country || 'all' }}
        run: |
          python -m pipelines --list
          countries=$(python -m pipelines "$COUNTRY" --matrix)
          echo "Countries to sync: $countries"
          echo "countries=$countries" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ matrix.country }}
    needs: start
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # one country after another
      fail-fast: false # a failing country does not stop the next one
      matrix:
        country: ${{ fromJSON(needs.start.outputs.countries) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync ${{ matrix.country }} from Wikipedia
        id: sync
        env:
          COUNTRY: ${{ matrix.country }}
          PRUNE: ${{ inputs.prune }}
          VERBOSE: ${{ inputs.verbose }}
          WIKIMEDIA_USER_AGENT: >-
            traffic-signs-sync/1.0 (https://github.com/${{ github.repository }}; GitHub Actions) python-urllib
        run: |
          args=("$COUNTRY" --report "$RUNNER_TEMP/report.md")
          if [ "$PRUNE" = "true" ]; then args+=(--prune); fi
          if [ "$VERBOSE" = "true" ]; then args+=(--verbose); fi
          if python -m pipelines "${args[@]}"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f "$RUNNER_TEMP/report.md" ]; then
            echo "The sync stopped before writing a report; see the job log." > "$RUNNER_TEMP/report.md"
          fi
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        id: pr
        # The changes are pushed to sync/<country> before the pull request is
        # opened, so a refused pull request loses nothing; the next step says
        # what to do instead of failing the whole sync.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/${{ matrix.country }}
          delete-branch: true
          add-paths: signs/**
          commit-message: "Sync traffic signs from Wikipedia (${{ matrix.country }})"
          title: "Sync traffic signs from Wikipedia (${{ matrix.country }})"
          body-path: ${{ runner.temp }}/report.md
          labels: sync

      # Usually "GitHub Actions is not permitted to create or approve pull
      # requests": the branch is pushed, only the pull request is missing.
      - name: Link to the pull request if it could not be opened
        if: steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          COUNTRY: ${{ matrix.country }}
        run: |
          branch="sync/$COUNTRY"
          if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::The changes could not be pushed to $branch, see the step above."
            exit 1
          fi
          if [ -n "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "::error::The pull request for $branch could not be updated, see the step above."
            exit 1
          fi
          title=$(jq -rn --arg t "Sync traffic signs from Wikipedia ($COUNTRY)" '$t | @uri')
          url="https://github.com/$REPO/compare/$BASE...$branch?expand=1&title=$title"
          setting="Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests"
          echo "::warning title=Pull request not opened::The changes are on $branch, but GitHub Actions may not open pull requests here. Open it from $url, or enable: $setting."
          {
            echo "### Pull request not opened"
            echo
            echo "The changes are on \`$branch\`: **[open the pull request]($url)**."
            echo
            echo "To let this workflow open it next time, enable *$setting*"
            echo "(if the repository belongs to an organisation, the organisation's Actions settings must allow it too)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the sync reported errors
        if: steps.sync.outputs.failed == 'true'
        env:
          COUNTRY: ${{ matrix.country }}
        run: |
          echo "::error::The $COUNTRY sync reported errors, see the job summary."
          exit 1
