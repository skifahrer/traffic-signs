<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traffic signs</title>
    <meta name="description" content="Road traffic signs from around the world, compared side by side across countries." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Traffic signs" />
    <meta property="og:title" content="Traffic signs" />
    <meta property="og:description" content="Road traffic signs from around the world, compared side by side across countries." />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 30 28H2Z' fill='%23fff' stroke='%23c4161c' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <form class="bar" role="search" onsubmit="return false">
        <h1>Traffic signs</h1>
        <label class="search">
          <span class="visually-hidden">Search</span>
          <input id="search" type="search" placeholder="Search name, code or folder…" autocomplete="off" enterkeyhint="search" />
        </label>
        <button id="share-view" type="button" class="share" title="Share this view" aria-label="Share this view">Share</button>
      </form>
      <!-- Open on wide screens, folded on phones (app.js); the summary line doubles as the result count. -->
      <details id="filters" class="filters">
        <summary><span class="filters-label">Filters</span> <span id="summary" class="muted">Loading…</span></summary>
        <div class="controls">
          <label>
            <span class="visually-hidden">Type</span>
            <select id="category"></select>
          </label>
          <fieldset id="countries" class="chips">
            <legend class="visually-hidden">Countries to compare</legend>
          </fieldset>
          <label class="check"><input id="shared" type="checkbox" /> In 2+ countries</label>
          <label class="check"><input id="withdrawn" type="checkbox" checked /> Withdrawn signs</label>
        </div>
      </details>
    </header>

    <main>
      <div id="loading" class="loading" role="status">
        <progress id="loading-bar"></progress>
        <p id="loading-text" class="muted">Loading signs…</p>
      </div>
      <div id="results"></div>
      <!-- Signs are added PAGE_SIZE at a time; scrolling near this loads the next batch. -->
      <div id="more" class="more" hidden>
        <p id="more-status" class="muted" aria-live="polite"></p>
        <button id="more-button" type="button">Show more</button>
      </div>
    </main>

    <dialog id="detail" aria-labelledby="detail-title">
      <form method="dialog" class="close"><button aria-label="Close">×</button></form>
      <div id="detail-body"></div>
    </dialog>

    <p id="toast" class="toast" role="status" hidden></p>

    <footer class="muted">
      Data and code: <a href="https://github.com/skifahrer/traffic-signs">github.com/skifahrer/traffic-signs</a>.
      Images come from Wikimedia Commons; each sign lists its author and licence.
    </footer>
    <script src="app.js" type="module"></script>
  </body>
</html>
